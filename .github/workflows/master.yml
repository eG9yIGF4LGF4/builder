name: Build
on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      platform:
        description: Platform
        required: false
        default: latest
        
env:
  TAG_NAME: ${{inputs.platform}}

jobs:
  buildroot:
    name: buildroot
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        platform:
          - ssc338q_apfpv
          - ssc30kq_rubyfpv_generic
          - ssc338q_rubyfpv_generic
 
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Prepare firmware
        run: |
          echo "nameserver 8.8.8.8" | sudo tee /etc/resolv.conf
          echo CACHE_DATE=$(date +%m) >> ${GITHUB_ENV}
          INPUT=${{inputs.platform}}
          MATRIX=$(echo ${{matrix.platform}} | cut -d_ -f1)
          #if [ ! -z ${INPUT} ] || [ ${INPUT} = "latest" ] || [ ${INPUT} = ${MATRIX} ]; then
            echo RUN=${MATRIX} >> ${GITHUB_ENV}
          #fi

      - name: Setup ccache
        if: env.RUN
        uses: actions/cache@v4
        with:
          path: /tmp/ccache
          key: ${{matrix.platform}}-${{env.CACHE_DATE}}-0

      - name: Build firmware
        if: env.RUN
        run: |
          export GIT_HASH=$(git rev-parse --short ${GITHUB_SHA})
          export GIT_BRANCH=${GITHUB_REF_NAME}
          echo GIT_HASH=${GIT_HASH} >> ${GITHUB_ENV}
          echo GIT_BRANCH=${GIT_BRANCH} >> ${GITHUB_ENV}

          mkdir -p /tmp/ccache
          ln -s /tmp/ccache ${HOME}/.ccache

          NAME=${{matrix.platform}}
          bash builder.sh ${NAME}
          cd openipc

          TIME=$(date -d @${SECONDS} +%M:%S)
          echo TIME=${TIME} >> ${GITHUB_ENV}
          COMMON=$(echo ${NAME} | awk -F_ '{print NF-1}')

          NORFW=$(find output/images -name openipc*nor*)
          if [ ! -z ${NORFW} ]; then
            if [ ${COMMON} -eq 1 ]; then
              echo NORFW=openipc/${NORFW} >> ${GITHUB_ENV}
            else
              mv ${NORFW} ../${NAME}-nor.tgz
              echo NORFW=${NAME}-nor.tgz >> ${GITHUB_ENV}
            fi
          fi

          NANDFW=$(find output/images -name openipc*nand*)
          if [ ! -z ${NANDFW} ]; then
            if [ ${COMMON} -eq 1 ]; then
              echo NANDFW=openipc/${NANDFW} >> ${GITHUB_ENV}
            else
              mv ${NANDFW} ../${NAME}-nand.tgz
              echo NANDFW=${NAME}-nand.tgz >> ${GITHUB_ENV}
            fi
          fi

          if [ -z ${NORFW} ] && [ -z ${NANDFW} ]; then
            exit 1
          fi
      - name: Upload firmware
        if: env.NORFW || env.NANDFW
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{env.TAG_NAME}}
          files: |
            ${{env.NORFW}}
            ${{env.NANDFW}}
            
  buildlinux:
    name: linux
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        platform:
          - pi
          - radxa
          - rk3528
          - rk3588

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        
      - name: Setup ccache
        if: env.RUN
        uses: actions/cache@v4
        with:
          path: /tmp/ccache
          key: ${{matrix.platform}}-${{env.CACHE_DATE}}-1
          
      - name: Prepare Runner Device
        uses: pguyot/arm-runner-action@v2
        with:
          base_image: raspios_lite_arm64:latest
          commands: |
            apt-get update -y
            apt-get install -y autoconf cmake make git curl wget qemu gcc qemu-user-static binfmt-support qemu-system-arm
            echo RUN=${MATRIX} >> ${GITHUB_ENV}
            printenv
            
            export GIT_HASH=$(git rev-parse --short ${GITHUB_SHA})
            export GIT_BRANCH=${GITHUB_REF_NAME}
            echo GIT_HASH=${GIT_HASH} >> ${GITHUB_ENV}
            echo GIT_BRANCH=${GIT_BRANCH} >> ${GITHUB_ENV}

            NAME=${{matrix.platform}}
            bash builder.sh ${NAME}
            cd linux

            TIME=$(date -d @${SECONDS} +%M:%S)
            echo TIME=${TIME} >> ${GITHUB_ENV}
            COMMON=$(echo ${NAME} | awk -F_ '{print NF-1}'

      - name: Upload firmware
        if: env.PI || env.RADXA || env.RK3528 || env.RK3588
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{env.TAG_NAME}}
          files: |
            ${{env.PI}}
            ${{env.RADXA}}
            ${{env.RK3528}}
            ${{env.RK3588}}
